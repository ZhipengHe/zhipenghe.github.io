- title: Academic Experience
  type: time_table
  contents:
    - title: "Postdoctoral Fellow"
      year: 2026.06 - PRESENT
      location: Brisbane, Australia
      department: School of Mechanical, Medical and Process Engineering
      institution: Queensland University of Technology
      description:
        - Conduct research on AI-To-Data (ATD), a decentralised privacy-preserving AI framework for multi-institute medical data, advancing it from TRL 3 to TRL 5 under the Australia's Economic Accelerator (AEA) Ignite grant.
        - Build training and evaluation pipelines to validate ATD at scale across distributed nodes on multi-modality medical datasets.
        - Manage milestone delivery of the 12-month grant, covering progress tracking, risk management, and reporting to the funder.
    - title: "Senior Project Officer"
      year: 2026.06 - PRESENT
      location: Brisbane, Australia
      department: Energy Transition Centre & School of Information Systems
      institution: Queensland University of Technology
      description:
        - Conduct research on multi-agent reinforcement learning (MARL) for coordinated optimisation of distributed Battery Energy Storage Systems (BESS) across household and community scales.
        - Design and implement MARL architectures for cross-scale coordination, balancing household objectives with community-level goals such as grid stability and renewable energy utilisation.
        - Develop a simulation testbed integrating public energy datasets to empirically evaluate the coordination architectures.
    - title: "Research Associate"
      year: 2025.08 - 2025.12
      location: Brisbane, Australia
      department: Energy Transition Centre & School of Information Systems
      institution: Queensland University of Technology
      description:
        - Reviewed and synthesised literature on BESS with a focus on operational optimisation across different scales.
        - Analysed how optimisation approaches and objectives differ across system scales.
        - Developed a structured framework to summarise and compare existing optimisation methods.
    - title: "PhD Research Project"
      year: 2022.02 - 2026.04
      location: Brisbane, Australia
      department: School of Information Systems
      institution: Queensland University of Technology
      description:
        - 'Title: <a href="https://doi.org/10.5204/thesis.eprints.264638" target="_blank"><b>Building Adversarially Robust Predictive Systems for Tabular Data</b></a>'
        - 'Co-advised by <a href="https://www.qut.edu.au/about/our-people/academic-profiles/c.ouyang" target="_blank"><b>A/Prof. Chun Ouyang</b></a> (Principal Supervisor), <a href="https://www.qut.edu.au/about/our-people/academic-profiles/alistair.barros" target="_blank"><b>Prof. Alistair Barros</b></a> (Associate Supervisor) and <a href="https://profiles.uts.edu.au/Catarina.PintoMoreira" target="_blank"><b>A/Prof. Catarina Moreira</b></a> (External Supervisor @UTS)'
        - "Addressed adversarial robustness of machine learning models on tabular data. Investigated state-of-the-art attack techniques, characterised what makes attacks on structured data imperceptible, and proposed metrics and a benchmark for evaluating these characteristics, laying the groundwork for defence mechanisms that improve model robustness against adversarial attacks in tabular domains."
    - title: "Senior Research Assistant"
      year: 2025.04 - 2025.09
      location: Brisbane, Australia
      department: School of Information Systems
      institution: Queensland University of Technology
      description:
        - 'Corporate Partner: <a href="https://elu.net.au/" target="_blank"><b>eLu Australia</b></a>'
        - "Established baseline understanding of electricity outages and price dynamics in the Australian National Electricity Market (NEM) through review of AEMO reports, industry literature, and exploratory data analysis."
        - "Identified and analysed root causes of electricity outages and price volatility within the NEM."
        - "Developed and evaluated a predictive model for electricity price forecasting, improving on current AEMO capabilities."
        - "Designed and implemented an interactive dashboard for visualising historical NEM data and real-time electricity price forecasts."
    - title: "Research Assistant"
      year: 2023.11 - 2023.12
      location: Brisbane, Australia
      department: School of Information Systems
      institution: Queensland University of Technology
      description:
        - Collected literature on multi-modal fusion for time-sequence data and identified related research gaps
        - Developed multi-modal fusion methods for time-sequence data to enhance the capability of predictive systems
        - Developed an open-source tool package implementing the fusion methods, enabling testing and validation
        - Designed and executed evaluation experiments using publicly accessible real-world datasets
    - title: "Research Assistant"
      year: 2021.10 - 2021.12
      location: Brisbane, Australia
      department: School of Information Systems
      institution: Queensland University of Technology
      description:
        - Developed an analytical method for applying explainable AI (XAI) techniques to the inspection of predictive models
        - Implemented the method as an open-source tool package for testing and validation using publicly available real-life datasets
        - Built visualisations of model inspection results and developed a website for project publicity
    - title: "Honours Research Project"
      year: 2021.02 - 2021.12
      location: Brisbane, Australia
      department: School of Information Systems
      institution: Queensland University of Technology
      description:
        - "Title: Investigating the Impact of Event Logs on Deep Learning-based Process Prediction Performance"
        - 'Co-advised by <a href="https://www.qut.edu.au/about/our-people/academic-profiles/c.ouyang" target="_blank"><b>A/Prof. Chun Ouyang</b></a> and <a href="https://profiles.uts.edu.au/Catarina.PintoMoreira" target="_blank"><b>A/Prof. Catarina Moreira</b></a>'
        - |
          Investigated and analysed the potential influence of specific characteristics of event logs when predicting next business process activity using deep learning techniques <br/>
          <ul>
            <li>Studying and identifying key characteristics of event logs</li>
            <li>Analysing the effects of event log characteristics on predicting next processactivity based on LSTM and Transformer</li>
          </ul>
        - 'Presented the research findings and outcome in the scientific paper (<a href="https://doi.org/10.1016/j.knosys.2022.108773" target="_blank"><b>KBS 2022</b></a>) and <a href="https://zhipenghe.me/assets/pdf/Honours_Thesis.pdf" target="_blank"><b>Honours thesis</b></a>'
    - title: "2021 AMSI Winter School Academic Training"
      year: 2021.07
      location: Brisbane, Australia
      department: Centre for Data Science
      institution: Queensland University of Technology
      description:
        - "Attended lectures and tutorials of advanced statistical learning knowledge such as Bayesian Statistics and Markov chain Monte Carlo related methods"
        - "Gained knowledge of generative deep learning models"
        - 'Presented a <a href="https://slides.zhipenghe.me/2021-07-AMSI.pdf" target="_blank"><b>participant talk</b></a> titled <em>Deep Learning-based Business Process Prediction</em> during the winter school'
    - title: "VRES Research Project"
      year: 2020.11 - 2021.02
      location: Brisbane, Australia
      department: School of Information Systems
      institution: Queensland University of Technology
      description:
        - "Title: Towards Design and Development of Interactive Visualisation for Organisational Analytics"
        - 'Advised by <a href="https://staff.qut.edu.au/staff/c.ouyang" target="_blank"><b>A/Prof. Chun Ouyang</b></a>'
        - "Aimed to address how to visualise organisational analytics results as informed by existing visual analytics design principles"
